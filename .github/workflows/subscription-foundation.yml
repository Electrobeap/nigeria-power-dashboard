name: Subscription security validation
on:
  pull_request:
    paths:
      - "grid_monitor/**"
      - "migrations/**"
      - "tests/**"
      - "requirements*.txt"
      - "docs/subscription*"
      - ".github/workflows/subscription-foundation.yml"
  push:
    branches: ["feature/subscriptions-integration-20261013", "feature/pro-entitlement-guards-20261014", "feature/paystack-sandbox-billing-20261014", "test/subscription-lifecycle-e2e-20261015"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: npd_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: npd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U npd_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      HISTORY_CAPTURE_ENABLED: "false"
      WEB_SCHEDULER_ENABLED: "false"
      INDEXNOW_ENABLED: "false"
      INDEXNOW_AUTO_NOTIFY_ENABLED: "false"
      RUN_MIGRATIONS_ON_STARTUP: "false"
      ACCOUNTS_ENABLED: "false"
      SUBSCRIPTIONS_ENABLED: "false"
      PREMIUM_GATING_ENABLED: "false"
      PAYSTACK_TEST_CHECKOUT_ENABLED: "false"
      LIVE_BILLING_ENABLED: "false"
      USD_CHECKOUT_ENABLED: "false"
      PRO_PREVIEW_ENABLED: "true"
      SUBSCRIPTION_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://npd_test:test-only-password@localhost:5432/npd_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-research.txt
            requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Dependency consistency
        run: python -m pip check
      - name: Stage D1 static analysis
        run: |
          python -m ruff check --select E9,F tests/billing_support.py tests/billing_transport.py tests/test_subscription_lifecycle.py tests/test_testing_safety.py
          python -m mypy --strict --follow-imports=skip tests/billing_transport.py
      - run: python -m compileall -q app.py grid_monitor migrations tools tests
      - run: python -m tools.research_publications validate
      - run: python -m playwright install --with-deps chromium
      - name: Complete regression suite
        run: python -m pytest -q --junitxml=test-results/${{ matrix.database }}.xml
      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subscription-tests-${{ matrix.database }}
          path: test-results/*.xml
          if-no-files-found: ignore
          retention-days: 14
