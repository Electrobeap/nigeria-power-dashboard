name: Research publishing validation
on:
  pull_request:
    paths:
      - "grid_monitor/**"
      - "tools/**"
      - "docs/research/**"
      - "docs/research-*.md"
      - "docs/research-*.json"
      - "docs/article-seo-audit.md"
      - "docs/search-console-monitoring.md"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/research-validation.yml"
  push:
    branches: ["feature/research-publishing-discovery", "feature/research-content-discovery", "feature/verified-research-repositories"]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HISTORY_CAPTURE_ENABLED: "false"
      WEB_SCHEDULER_ENABLED: "false"
      INDEXNOW_ENABLED: "false"
      INDEXNOW_AUTO_NOTIFY_ENABLED: "false"
      RUN_MIGRATIONS_ON_STARTUP: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-research.txt
      - run: python -m pip install -r requirements-research.txt
      - run: python -m compileall -q app.py grid_monitor tools tests
      - run: python -m tools.research_publications validate
      - run: python -m tools.research_publications repositories
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q
      - name: Bounded public data coverage audit (read-only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/research-content-discovery'
        run: python -m tools.research_data_audit public
