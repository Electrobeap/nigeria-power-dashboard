services:
  - type: web
    name: nigeria-power-grid-monitor
    env: python
    buildCommand: python -m pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app
    autoDeploy: true
    envVars:
      - key: WEB_SCHEDULER_ENABLED
        value: "1"
      - key: HISTORY_CAPTURE_ENABLED
        value: "1"
      - key: HISTORY_CAPTURE_ON_STARTUP
        value: "1"
